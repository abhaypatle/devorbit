version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devorbit
      POSTGRES_USER: devorbit
      POSTGRES_PASSWORD: devorbit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://devorbit:devorbit@db:5432/devorbit
    depends_on:
      - db
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
